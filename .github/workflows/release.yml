name: release

on:
  push:
    tags:
      - "*-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can authenticate
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      deployments: read

    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5

      - name: check that named environments exist
        run: |
          environments="$(bun -e '
            const workflow = Bun.YAML.parse(await Bun.file(".github/workflows/release.yml").text());
            for (const job of Object.values(workflow.jobs)) {
              const environment = job.environment;
              if (environment) console.log(typeof environment === "string" ? environment : environment.name);
            }
          ')"
          if [ -z "$environments" ]; then
            echo "no job names an environment"
          fi
          for environment in $environments; do
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment" --jq '.name'
          done

      - name: check the tag has no release yet
        if: env.TAG != ''
        run: |
          if output="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"; then
            echo "a release for $TAG already exists" >&2
            exit 1
          fi
          if ! grep -q "Not Found" <<<"$output"; then
            echo "$output" >&2
            exit 1
          fi

  release:
    name: Zip and publish the extension
    needs: preflight
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5

      - name: check the version and the release notes
        run: bun run release:verify

      - run: bun install --frozen-lockfile

      - name: zip for chromium and firefox
        run: bun run zip

      - name: check the built manifests
        run: bun run release:verify:built

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: extensions/*/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/')
        run:
          gh release create "$TAG" "extensions/$EXTENSION"/.output/*.zip --title
          "$TAG" --notes-file "extensions/$EXTENSION/release-notes.md"
          --generate-notes
