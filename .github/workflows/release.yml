name: release

on:
  push:
    tags:
      - "*-v*"

jobs:
  release:
    name: Zip and publish the tagged extension
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: resolve the extension from the tag
        run: mise run release:verify

      - run: mise run install

      - name: zip for chromium and firefox
        run: mise run zip

      - name: publish the release
        run:
          gh release create "$TAG" "extensions/$EXTENSION"/.output/*.zip --title
          "$TAG" --generate-notes
