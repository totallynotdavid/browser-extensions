[tools]
bun = "1.4.3"
node = "26.12.0"

[tasks.install]
description = "Install dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Check lint rules and formatting, Markdown included"
run = ["bunx oxlint --deny-warnings", "bunx oxfmt --check"]

[tasks.fix]
description = "Apply safe lint fixes and format every file"
run = ["bunx oxlint --fix", "bunx oxfmt"]

[tasks.typecheck]
description = "Type check every extension"
run = "bun run --filter './extensions/*' typecheck"

[tasks.test]
description = "Run every extension's unit tests"
run = "bun run --filter './extensions/*' test"

[tasks.build]
description = "Build every extension for Chromium and Firefox"
wait_for = ["typecheck", "test"]
run = [
  "bun run --filter './extensions/*' build",
  "bun run --filter './extensions/*' build:firefox",
]

[tasks.check]
description = "Lint, type check, test and build; the entry for CI"
depends = ["lint", "typecheck", "test", "build"]

[tasks.zip]
description = "Zip for Chromium and Firefox; set EXTENSION to zip one extension"
run = [
  "bun run --filter \"./extensions/${EXTENSION:-*}\" zip",
  "bun run --filter \"./extensions/${EXTENSION:-*}\" zip:firefox",
]

[tasks."release:verify"]
description = "Check that TAG names an extension at its package.json version"
run = "scripts/verify-release.sh"
